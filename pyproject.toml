[project]
name = "mzoo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "fire>=0.7.1",
    "liger-kernel>=0.8.2",
    "tilelang>=0.1.14",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "trl>=1.13.0",
    "wandb>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

#[tool.uv]
#cache-dir = "/tmp/uv-cache"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
