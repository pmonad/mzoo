site_name: mzoo
site_url: https://pmonad.github.io/mzoo/
docs_dir: docs
site_dir: site
exclude_docs: README.md
use_directory_urls: false
theme:
  name: readthedocs
  navigation_depth: 3
  collapse_navigation: false
  titles_only: false
plugins:
  - search
  - bibtex:
      bib_file: docs/references.bib
markdown_extensions:
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/sidebar-resize.js
nav:
  - Evolution:
      - evolution/index.md
      - 1 GPT-2: evolution/01-gpt2/index.md
      - 2 Normalisation: evolution/02-normalisation/index.md
      - 3 Positions: evolution/03-positions/index.md
      - 4 Feed-forward: evolution/04-feed-forward/index.md
      - 5 KV cache: evolution/05-kv-cache/index.md
      - 6 Mixture of experts:
          - evolution/06-moe/index.md
          - Routing: evolution/06-moe/routing.md
          - Fine-grained and shared experts: evolution/06-moe/experts.md
          - Load balancing: evolution/06-moe/balancing.md
      - 7 Low-rank attention:
          - evolution/07-low-rank-attention/index.md
          - MLA: evolution/07-low-rank-attention/mla.md
          - Single shared latent: evolution/07-low-rank-attention/shared-latent.md
      - 8 Local attention: evolution/08-local-attention/index.md
      - 9 Compressed attention:
          - evolution/09-compressed-attention/index.md
          - Compressor: evolution/09-compressed-attention/compressor.md
          - Sharing across layers: evolution/09-compressed-attention/sharing.md
      - 10 Sparse selection:
          - evolution/10-sparse-selection/index.md
          - Indexer: evolution/10-sparse-selection/indexer.md
          - Hierarchical selection: evolution/10-sparse-selection/hierarchical.md
          - Training the indexer: evolution/10-sparse-selection/training.md
      - 11 Residual stream:
          - evolution/11-residual/index.md
          - Hyper-connections: evolution/11-residual/hyper-connections.md
          - mHC: evolution/11-residual/mhc.md
          - Single-pass mHC: evolution/11-residual/single-pass.md
      - 12 Numerics:
          - evolution/12-numerics/index.md
          - bf16 and FP8: evolution/12-numerics/fp8.md
          - FP4: evolution/12-numerics/fp4.md
          - Gradients through quantisation: evolution/12-numerics/ste.md
      - 13 Engram: evolution/13-engram/index.md
      - 14 Beyond the block: evolution/14-beyond-the-block/index.md
      - 15 Assembly: evolution/15-assembly/index.md
